name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconfort-portfolio-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: [self-hosted, reconfort-portfolio]
    timeout-minutes: 15

    steps:
      - name: Check out the release
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Keep production dependencies only
        run: npm prune --omit=dev

      - name: Activate release
        env:
          RELEASE: /opt/reconfort-portfolio/releases/${{ github.sha }}
        run: |
          install -d -m 0755 /opt/reconfort-portfolio/releases
          rm -rf "$RELEASE"
          install -d -m 0755 "$RELEASE"
          rsync -a --delete --exclude=.git --exclude=.github "$GITHUB_WORKSPACE/" "$RELEASE/"
          ln -sfn "$RELEASE" /opt/reconfort-portfolio/current
          sudo /usr/local/sbin/reconfort-portfolio-deploy

      - name: Smoke test
        run: curl --fail --retry 6 --retry-delay 2 http://127.0.0.1:3040/
